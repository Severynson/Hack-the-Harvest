[project]
name = "autoresearch"
version = "0.2.0"
description = "Autoresearch loop for field-level silage vs grain classification on BARC corn fields"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10",
    "planetary-computer>=1.0",
    "pyarrow>=17.0",
    "pyogrio>=0.9",
    "pystac-client>=0.8",
    "rasterio>=1.4",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shapely>=2.0",
]
